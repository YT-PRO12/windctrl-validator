name: Engineering CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: '3.11'
          - os: ubuntu-latest
            python: '3.12'
          - os: windows-latest
            python: '3.12'
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            requirements-dev.txt
      - name: Install development dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Lint
        run: python -m ruff check .
      - name: Unit, regression and integration tests
        run: python -m pytest --cov=windctrl --cov-branch  --cov-report=term-missing --cov-report=xml --junitxml=test-results/junit.xml
      - name: Build distributable package
        run: python -m build
      - name: CLI smoke test
        run: python -m windctrl --input data/controller_samples.csv --output outputs
      - name: Upload test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-evidence-${{ matrix.os }}-${{ matrix.python }}
          path: |
            test-results/
            coverage.xml
          if-no-files-found: warn
      - name: Upload verified package
        uses: actions/upload-artifact@v4
        with:
          name: package-${{ matrix.os }}-${{ matrix.python }}
          path: dist/*
          if-no-files-found: error
